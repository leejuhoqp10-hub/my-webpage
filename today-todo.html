<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일</title>
<style>
:root{
  --bg:#e9eef3; --paper:#fbfcfd; --ink:#1c2733; --sub:#5d6b7a; --line:#d3dce5;
  --study:#3b4fd8; --study-bg:#e4e8fc; --life:#0f8a74; --life-bg:#d9f1ec; --done:#9aa7b4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
header h1{margin:0 0 14px;font-size:26px;letter-spacing:-.02em}
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.date-bar button,.date-bar input{font:inherit;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;color:var(--ink)}
.date-bar button{cursor:pointer}
.date-bar input{flex:1;min-width:0}
.date-bar .today{margin-left:auto;font-size:14px}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.pct{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.pct strong{font-size:44px;line-height:1;letter-spacing:-.03em}
.pct span{color:var(--sub);font-size:14px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--study),var(--life));transition:width .35s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.stats div{border-top:3px solid var(--line);padding-top:6px;color:var(--sub);font-size:13px}
.stats b{display:block;font-size:22px;color:var(--ink)}
.stats .remain{border-color:var(--study)} .stats .complete{border-color:var(--life)}
form{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
form input[type=text]{flex:1 1 200px;min-width:0}
form select,form input,form button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);color:var(--ink)}
form button{background:var(--ink);color:#fff;border-color:var(--ink);cursor:pointer;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--sub)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:10px 12px}
li.study{border-left-color:var(--study)} li.life{border-left-color:var(--life)}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink);flex:none;cursor:pointer}
.txt{flex:1;min-width:0;word-break:break-word}
li.done .txt{text-decoration:line-through;color:var(--done)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;flex:none}
.study .tag{background:var(--study-bg);color:var(--study)} .life .tag{background:var(--life-bg);color:var(--life)}
.edit-in{flex:1;font:inherit;border:1px solid var(--study);border-radius:6px;padding:4px 8px;min-width:0}
.act{display:flex;gap:2px;flex:none}
.act button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--sub);cursor:pointer;padding:4px 6px;border-radius:6px}
.act button:hover{background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:32px 0;border:1px dashed var(--line);border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--study);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header><h1>오늘의 할 일</h1></header>

  <div class="date-bar">
    <button id="prev" aria-label="이전 날짜">‹</button>
    <input type="date" id="date" aria-label="날짜 선택">
    <button id="next" aria-label="다음 날짜">›</button>
    <button id="today" class="today">오늘</button>
  </div>

  <section class="summary" aria-live="polite">
    <div class="pct"><strong id="pct">0%</strong><span id="msg">할 일을 추가해 보세요</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barwrap"><i id="bar"></i></div>
    <div class="stats">
      <div>전체<b id="total">0</b></div>
      <div class="remain">남은 일<b id="remain">0</b></div>
      <div class="complete">완료<b id="complete">0</b></div>
    </div>
  </section>

  <form id="form">
    <input type="text" id="input" placeholder="할 일을 입력하세요" maxlength="100" required aria-label="할 일">
    <select id="cat" aria-label="분류"><option value="study">학업</option><option value="life">일상</option></select>
    <button type="submit">추가</button>
  </form>

  <div class="tabs" role="group" aria-label="분류 필터">
    <button data-f="all" aria-pressed="true">전체</button>
    <button data-f="study" aria-pressed="false">학업</button>
    <button data-f="life" aria-pressed="false">일상</button>
  </div>

  <ul id="list"></ul>
</main>

<script>
(function(){
  var KEY="today-todo-v1", CAT={study:"학업",life:"일상"};
  var tasks=[], filter="all", editing=null;
  var $=function(id){return document.getElementById(id)};

  function load(){try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  function ymd(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day}
  function shift(n){var p=$("date").value.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]+n);$("date").value=ymd(d);render()}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

  function render(){
    var date=$("date").value;
    var day=tasks.filter(function(t){return t.date===date});
    var total=day.length, done=day.filter(function(t){return t.done}).length, remain=total-done;
    var pct=total?Math.round(done/total*100):0;
    $("total").textContent=total; $("remain").textContent=remain; $("complete").textContent=done;
    $("pct").textContent=pct+"%"; $("bar").style.width=pct+"%"; $("barwrap").setAttribute("aria-valuenow",pct);
    $("msg").textContent= !total?"할 일을 추가해 보세요": remain===0?"오늘 할 일을 모두 끝냈어요!":remain+"개 남았어요";

    var shown=day.filter(function(t){return filter==="all"||t.cat===filter});
    var ul=$("list");
    if(!shown.length){ul.innerHTML='<li class="empty" style="display:block;border-left-width:1px">'+(total?"이 분류에는 할 일이 없어요.":"이 날짜에 등록된 할 일이 없어요.")+"</li>";return}
    ul.innerHTML=shown.map(function(t){
      var isEdit=editing===t.id;
      return '<li class="'+t.cat+(t.done?" done":"")+'" data-id="'+t.id+'">'+
        '<input type="checkbox" data-a="toggle" '+(t.done?"checked":"")+' aria-label="완료 표시">'+
        '<span class="tag">'+CAT[t.cat]+'</span>'+
        (isEdit?'<input class="edit-in" type="text" maxlength="100" value="'+esc(t.text).replace(/"/g,"&quot;")+'" aria-label="할 일 수정">'
               :'<span class="txt">'+esc(t.text)+'</span>')+
        '<span class="act">'+(isEdit?'<button data-a="save">저장</button><button data-a="cancel">취소</button>'
               :'<button data-a="edit">수정</button><button data-a="del">삭제</button>')+'</span></li>';
    }).join("");
    var inp=ul.querySelector(".edit-in"); if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
  }

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var text=$("input").value.trim(); if(!text)return;
    tasks.push({id:Date.now()+Math.random().toString(36).slice(2,6),text:text,cat:$("cat").value,date:$("date").value,done:false});
    save(); $("input").value=""; render(); $("input").focus();
  });

  $("list").addEventListener("click",function(e){
    var b=e.target.closest("[data-a]"); if(!b)return;
    var li=b.closest("li"), id=li.dataset.id, a=b.dataset.a;
    var t=tasks.filter(function(x){return x.id===id})[0]; if(!t)return;
    if(a==="toggle"){t.done=b.checked;save();render()}
    else if(a==="del"){tasks=tasks.filter(function(x){return x.id!==id});save();render()}
    else if(a==="edit"){editing=id;render()}
    else if(a==="cancel"){editing=null;render()}
    else if(a==="save"){commit(li,t)}
  });
  $("list").addEventListener("keydown",function(e){
    var inp=e.target.closest(".edit-in"); if(!inp)return;
    var li=inp.closest("li"), t=tasks.filter(function(x){return x.id===li.dataset.id})[0];
    if(e.key==="Enter"){e.preventDefault();commit(li,t)} else if(e.key==="Escape"){editing=null;render()}
  });
  function commit(li,t){var v=li.querySelector(".edit-in").value.trim(); if(v){t.text=v;save()} editing=null; render()}

  document.querySelectorAll(".tabs button").forEach(function(btn){
    btn.addEventListener("click",function(){
      filter=btn.dataset.f;
      document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-pressed",x===btn)});
      render();
    });
  });
  $("prev").onclick=function(){shift(-1)}; $("next").onclick=function(){shift(1)};
  $("today").onclick=function(){$("date").value=ymd(new Date());render()};
  $("date").addEventListener("change",function(){if(!$("date").value)$("date").value=ymd(new Date());render()});

  load(); $("date").value=ymd(new Date()); render();
})();
</script>
</body>
</html>
