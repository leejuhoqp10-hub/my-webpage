<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 주사위 시뮬레이터</title>
<style>
:root{--ink:#18243a;--bg:#eef2f8;--line:#cbd6e6;--blue:#2e6fdb;--red:#d6392f;--green:#17895a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px 14px 40px}
.app{max-width:1060px;margin:0 auto}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.sub{margin:0 0 14px;color:#4c5a72}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
h2{margin:0 0 10px;font-size:19px}
.stage{position:relative;width:100%;aspect-ratio:4/3;min-height:240px;background:linear-gradient(#dbe8f7,#f4f8fd);border-radius:12px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#5a6780}
.badge{position:absolute;left:12px;top:10px;background:rgba(24,36,58,.88);color:#fff;border-radius:12px;padding:6px 14px;font-size:16px}
.badge b{font-size:30px;margin-left:6px;vertical-align:-3px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns button{font:inherit;font-size:17px;font-weight:700;min-height:52px;padding:0 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;flex:1 1 auto}
.btns button.reset{background:#fff;color:var(--ink);border:2px solid var(--line);flex:0 0 auto}
.btns button:disabled,.custom button:disabled{opacity:.45;cursor:default}
.custom{display:flex;gap:8px;margin-top:8px}
.custom input{flex:1;min-width:0;font:inherit;font-size:17px;padding:0 12px;min-height:52px;border:2px solid var(--line);border-radius:12px}
.custom button{font:inherit;font-size:17px;font-weight:700;min-height:52px;padding:0 18px;border:0;border-radius:12px;background:#0f1f3a;color:#fff;cursor:pointer}
.msg{min-height:22px;margin:6px 2px 0;color:#b3261e;font-size:15px}
button:focus-visible,input:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
.recent{margin-top:6px;font-size:15px;color:#4c5a72}
.recent span{display:inline-block;min-width:26px;text-align:center;background:var(--bg);border-radius:8px;margin:2px;padding:1px 6px;font-weight:700;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--bg);font-size:15px}
tr.hit td{background:#fff3c4}
tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.chk{margin-top:8px;font-size:16px;font-weight:700;color:var(--green)}
.chart{position:relative;height:250px;margin-top:6px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;padding:0 4px 30px;border-bottom:2px solid var(--ink)}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.val{font-size:13px;text-align:center;line-height:1.25;margin-bottom:3px;white-space:nowrap}
.bar{width:100%;max-width:56px;background:var(--blue);border-radius:6px 6px 0 0;height:0;transition:height .12s linear}
.col:nth-child(1) .bar{background:#d6392f}
.lbl{position:absolute;bottom:-28px;font-weight:800}
.theory{position:absolute;left:0;right:0;border-top:2px dashed #e08a00;pointer-events:none}
.theory span{position:absolute;right:2px;top:-20px;font-size:12px;color:#a86400;background:#fff;padding:0 4px;border-radius:4px}
</style>
</head>
<body>
<div class="app">
  <h1>🎲 3D 주사위 시뮬레이터</h1>
  <p class="sub">주사위를 굴려 눈이 나온 횟수와 비율을 실시간 그래프로 확인해 보세요.</p>

  <div class="grid">
    <section class="card">
      <h2>주사위 굴리기</h2>
      <div class="stage" id="stage">
        <div class="badge" id="badge">마지막 결과 <b id="last">-</b></div>
        <div class="nogl" id="nogl">3D 화면을 불러오지 못했어요. 인터넷에 연결하면 3D 주사위가 보여요. 집계와 그래프는 그대로 사용할 수 있어요.</div>
      </div>
      <div class="btns">
        <button data-n="1">1번</button>
        <button data-n="10">10번</button>
        <button data-n="100">100번</button>
        <button class="reset" id="reset">⟲ 초기화</button>
      </div>
      <div class="custom">
        <input type="number" id="cnt" min="1" max="100000" step="1" placeholder="횟수 입력 (1~100000)" aria-label="굴릴 횟수">
        <button id="goCustom">굴리기</button>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <div class="recent" id="recent"></div>
    </section>

    <section class="card">
      <h2>결과 집계</h2>
      <table>
        <thead><tr><th>주사위 눈</th><th>나온 횟수</th><th>백분율</th></tr></thead>
        <tbody id="tb"></tbody>
        <tfoot><tr><td>합계</td><td id="sumC">0</td><td id="sumP">0.0%</td></tr></tfoot>
      </table>
      <div class="chk" id="chk"></div>
      <h2 style="margin-top:16px">백분율 막대그래프</h2>
      <div class="chart" id="chart"></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var FACE_CHAR=["","⚀","⚁","⚂","⚃","⚄","⚅"];
var counts=[0,0,0,0,0,0,0], total=0, recent=[], lastVal=null, busy=false, anim=null;

/* ---------- 표 / 그래프 ---------- */
(function initUI(){
  var tb="", ch="";
  for(var v=1;v<=6;v++){
    tb+='<tr id="r'+v+'"><td>'+FACE_CHAR[v]+' '+v+'</td><td id="c'+v+'">0</td><td id="p'+v+'">0.0%</td></tr>';
    ch+='<div class="col"><div class="val" id="v'+v+'">0<br>0.0%</div><div class="bar" id="b'+v+'"></div><div class="lbl">'+v+'</div></div>';
  }
  $("tb").innerHTML=tb;
  $("chart").innerHTML=ch+'<div class="theory" id="theory"><span>이론값 16.7%</span></div>';
})();

function renderStats(){
  var sum=0, maxP=0, v;
  for(v=1;v<=6;v++){sum+=counts[v]; var p=total?counts[v]/total*100:0; if(p>maxP)maxP=p}
  var ymax=Math.max(30,Math.ceil((maxP+4)/5)*5);
  for(v=1;v<=6;v++){
    var pc=total?counts[v]/total*100:0;
    $("c"+v).textContent=counts[v].toLocaleString();
    $("p"+v).textContent=pc.toFixed(1)+"%";
    $("v"+v).innerHTML=counts[v].toLocaleString()+"<br>"+pc.toFixed(1)+"%";
    $("b"+v).style.height=(pc/ymax*175)+"px";
    $("r"+v).className=(lastVal===v&&!busy)?"hit":"";
  }
  $("theory").style.bottom=(30+(100/6)/ymax*175)+"px";
  $("sumC").textContent=sum.toLocaleString();
  $("sumP").textContent=(total?sum/total*100:0).toFixed(1)+"%";
  $("chk").textContent=total===0?"":(sum===total?"✔ 눈별 횟수의 합("+sum.toLocaleString()+") = 전체 굴린 횟수("+total.toLocaleString()+")":"⚠ 합계가 맞지 않아요");
  $("chk").style.color=(sum===total)?"#17895a":"#b3261e";
  $("last").textContent=(lastVal===null||busy)?(busy?"…":"-"):lastVal;
  $("recent").innerHTML=recent.length?"최근 결과: "+recent.map(function(r){return"<span>"+r+"</span>"}).join(""):"";
}

/* ---------- 3D 주사위 ---------- */
var HAS3D=typeof THREE!=="undefined", scene,camera,renderer,die;
var NORMAL={1:[0,1,0],6:[0,-1,0],2:[0,0,1],5:[0,0,-1],3:[1,0,0],4:[-1,0,0]};
var MAT_ORDER=[3,4,1,6,2,5];  /* BoxGeometry 면 순서: +x,-x,+y,-y,+z,-z */

function faceTex(n){
  var c=document.createElement("canvas"); c.width=c.height=256; var g=c.getContext("2d");
  g.fillStyle="#fbfaf4"; g.fillRect(0,0,256,256);
  g.strokeStyle="#cfcab8"; g.lineWidth=10; g.strokeRect(5,5,246,246);
  var pos=[[64,64],[128,64],[192,64],[64,128],[128,128],[192,128],[64,192],[128,192],[192,192]];
  var pat={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];
  g.fillStyle=n===1?"#d6392f":"#1a1a1a";
  pat.forEach(function(i){g.beginPath();g.arc(pos[i][0],pos[i][1],n===1?36:24,0,Math.PI*2);g.fill()});
  return new THREE.CanvasTexture(c);
}

function init3D(){
  var stage=$("stage");
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(38,4/3,.1,100);
  camera.position.set(0,4.6,6); camera.lookAt(0,.5,0);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;
  stage.insertBefore(renderer.domElement,stage.firstChild);
  scene.add(new THREE.AmbientLight(0xffffff,.75));
  var dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(3,7,4); dl.castShadow=true;
  dl.shadow.mapSize.set(1024,1024); scene.add(dl);
  var floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.22}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  var mats=MAT_ORDER.map(function(n){return new THREE.MeshStandardMaterial({map:faceTex(n),roughness:.45})});
  die=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.7,1.7),mats);
  die.castShadow=true; die.position.y=.85; scene.add(die);
  function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  resize(); window.addEventListener("resize",resize);
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
}
if(HAS3D){try{init3D()}catch(e){HAS3D=false}}
if(!HAS3D)$("nogl").style.display="flex";

function ease(t){return 1-Math.pow(1-t,3)}

/* ---------- 굴리기 ---------- */
function setBusy(b){busy=b;document.querySelectorAll(".btns button:not(.reset),#goCustom").forEach(function(x){x.disabled=b})}

function roll(n){
  if(busy)return;
  var res=new Uint8Array(n);
  for(var i=0;i<n;i++)res[i]=1+Math.floor(Math.random()*6);   /* 결과를 먼저 정하고, 3D는 그 눈이 위로 오도록 보여줌 */
  var last=res[n-1], a={res:res,n:n,p:0,t0:performance.now(),dur:n===1?1300:1600,last:last};
  if(HAS3D){
    var yaw=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*Math.PI*2);
    var up=new THREE.Vector3(0,1,0), nv=new THREE.Vector3().fromArray(NORMAL[last]);
    a.target=yaw.multiply(new THREE.Quaternion().setFromUnitVectors(nv,up));
    a.start=die.quaternion.clone();
    a.axis=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();
    a.spins=2+Math.random()*2;
  }
  anim=a; setBusy(true); $("msg").textContent=""; renderStats();
}

function tick(now){
  if(anim){
    var a=anim, t=Math.min(1,(now-a.t0)/a.dur), e=ease(t);
    var k=t>=1?a.n:Math.floor(a.n*e);
    while(a.p<k){counts[a.res[a.p]]++;total++;a.p++}
    if(HAS3D){
      var base=a.start.clone().slerp(a.target,e);
      var extra=new THREE.Quaternion().setFromAxisAngle(a.axis,(1-e)*a.spins*Math.PI*2);
      die.quaternion.copy(extra.multiply(base));
      die.position.y=.85+2.6*(1-t)*Math.abs(Math.sin(t*Math.PI*3));
      die.position.x=(1-e)*Math.sin(t*9)*.25;
    }
    if(t>=1){
      lastVal=a.last;
      for(var i=Math.max(0,a.n-10);i<a.n;i++)recent.push(a.res[i]);
      recent=recent.slice(-10);
      if(HAS3D){die.quaternion.copy(a.target);die.position.set(0,.85,0)}
      anim=null; setBusy(false);
    }
    renderStats();
  }
  if(HAS3D)renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

document.querySelectorAll(".btns button[data-n]").forEach(function(b){b.onclick=function(){roll(+b.dataset.n)}});
function custom(){
  var raw=$("cnt").value.trim(), n=Number(raw);
  if(!raw||!isFinite(n)||Math.floor(n)!==n||n<1||n>100000){$("msg").textContent="1 이상 100000 이하의 정수를 입력해 주세요.";return}
  roll(n);
}
$("goCustom").onclick=custom;
$("cnt").addEventListener("keydown",function(e){if(e.key==="Enter")custom()});
$("reset").onclick=function(){
  anim=null; setBusy(false); counts=[0,0,0,0,0,0,0]; total=0; recent=[]; lastVal=null; $("msg").textContent="";
  if(HAS3D){die.quaternion.identity();die.position.set(0,.85,0)}
  renderStats();
};
renderStats(); requestAnimationFrame(tick);
</script>
</body>
</html>
