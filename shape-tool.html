<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도형 놀이터</title>
<style>
:root{--ink:#1b2a41;--blue:#2a7de1;--orange:#f08a24;--bg:#eef4fb;--line:#c9d9ec;--ok:#1f9d55;--no:#d6453d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px 14px 40px}
.app{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:28px;flex:1;letter-spacing:-.02em}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
#mute{width:46px;height:46px;font-size:22px;border:1px solid var(--line);background:#fff;border-radius:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;min-height:52px;font-size:19px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:14px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.stages{display:grid;grid-template-columns:1fr;gap:12px}
.stages.two{grid-template-columns:1fr 1fr}
figure{margin:0;text-align:center}
figcaption{font-weight:700;margin-bottom:4px;font-size:17px}
svg{width:100%;max-width:340px;aspect-ratio:1;background:#f8fbff;border:1px solid var(--line);border-radius:14px}
.obj{transition:transform .3s ease;transform-origin:0 0}
@media (prefers-reduced-motion:reduce){.obj{transition:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:48px;padding:6px 14px;border:2px solid var(--line);background:#fff;border-radius:999px;font-size:17px}
.chips button[aria-pressed=true]{border-color:var(--blue);background:#e4f0ff;font-weight:700}
.ctrl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ctrl button{min-height:64px;font-size:19px;font-weight:700;border:0;border-radius:14px;background:var(--blue);color:#fff}
.ctrl button.flip{background:#6a4fd6}
.ctrl button.reset{background:#fff;color:var(--ink);border:2px solid var(--line)}
.ctrl button:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.log{margin:10px 0 0;color:#46566f;font-size:16px;min-height:26px}
.help{font-size:16px;line-height:1.7;margin:0;padding-left:20px}
.help b{color:#4a35b5}
.info{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px;color:#2d5f9f}
#fb{display:none;margin-top:12px;padding:14px;border-radius:14px;font-size:19px;font-weight:700}
#fb.ok{display:block;background:#dff5e8;color:#14653a}
#fb.no{display:block;background:#fde8e6;color:#9b2a24}
.big{width:100%;min-height:60px;margin-top:12px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:20px;font-weight:700}
.hidden{display:none!important}
.result{text-align:center}
.result .n{font-size:64px;font-weight:800;color:var(--blue)}
@media (max-width:520px){h1{font-size:23px}.stages.two{gap:6px}figcaption{font-size:15px}}
</style>
</head>
<body>
<div class="app">
  <header><h1>🔷 도형 놀이터</h1><button id="mute" aria-label="효과음 끄기/켜기">🔊</button></header>
  <div class="tabs" role="group" aria-label="모드">
    <button id="tPrac" aria-pressed="true">🧩 연습 모드</button>
    <button id="tQuiz" aria-pressed="false">🎯 퀴즈 모드</button>
  </div>

  <section class="card" id="stageCard">
    <div class="info hidden" id="qinfo"><span id="qn"></span><span id="qs"></span></div>
    <div class="stages" id="stages">
      <figure id="tgtBox" class="hidden"><figcaption>🟧 목표 모양</figcaption><svg id="tgt" viewBox="-115 -115 230 230" role="img" aria-label="목표 도형"></svg></figure>
      <figure><figcaption id="meCap">🟦 내 도형</figcaption><svg id="me" viewBox="-115 -115 230 230" role="img" aria-label="내 도형"></svg></figure>
    </div>
    <p class="log" id="log"></p>
    <div id="fb" role="status" aria-live="polite"></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="result"><div id="stars" style="font-size:34px"></div><div class="n"><span id="fin">0</span> / 5</div><p id="msg" style="font-size:19px"></p>
    <button class="big" id="again">🔄 다시 도전</button></div>
  </section>

  <section class="card" id="shapeCard">
    <div class="chips" id="chips" role="group" aria-label="도형 고르기"></div>
  </section>

  <section class="card" id="ctrlCard">
    <div class="ctrl">
      <button id="ccw">↺ 반시계 방향 돌리기</button>
      <button id="cw">↻ 시계 방향 돌리기</button>
      <button id="fh" class="flip">↔ 좌우 뒤집기</button>
      <button id="fv" class="flip">↕ 상하 뒤집기</button>
    </div>
    <div class="row">
      <button class="big reset" id="reset" style="width:auto;flex:1;margin:0;background:#fff;color:var(--ink);border:2px solid var(--line);min-height:52px;font-size:18px">⟲ 처음으로</button>
      <label id="stepWrap">돌리는 각도 <select id="step"><option value="90">90°</option><option value="45">45°</option><option value="15">15°</option></select></label>
    </div>
    <button class="big hidden" id="check">✅ 정답 확인</button>
    <button class="big hidden" id="next" style="background:var(--blue)">다음 문제 ▶</button>
  </section>

  <section class="card" id="helpCard">
    <ul class="help">
      <li><b>돌리기</b>: 도형을 빙글 돌려요. 시계 바늘이 가는 쪽이 시계 방향이에요.</li>
      <li><b>좌우 뒤집기</b>: 거울에 비춘 것처럼 왼쪽과 오른쪽이 서로 바뀌어요.</li>
      <li><b>상하 뒤집기</b>: 위쪽과 아래쪽이 서로 바뀌어요.</li>
      <li>⚪ 표시가 어디로 움직이는지 보면 돌렸는지, 뒤집었는지 알 수 있어요. 색이 달라도 모양이 같으면 같은 도형이에요!</li>
    </ul>
  </section>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var P5=[0,1,2,3,4].map(function(i){var a=(-90+72*i)*Math.PI/180;return [Math.round(90*Math.cos(a)),Math.round(90*Math.sin(a))]});
var SHAPES=[
 {n:"정삼각형",p:[[0,-90],[78,45],[-78,45]]},
 {n:"직각삼각형",p:[[-70,70],[-70,-70],[80,70]]},
 {n:"정사각형",p:[[-65,-65],[65,-65],[65,65],[-65,65]]},
 {n:"직사각형",p:[[-90,-50],[90,-50],[90,50],[-90,50]]},
 {n:"정오각형",p:P5},
 {n:"평행사변형",p:[[-85,50],[-35,-50],[85,-50],[35,50]]},
 {n:"ㄴ자 도형",p:[[-60,-80],[-20,-80],[-20,40],[60,40],[60,80],[-60,80]]}
];
var I=[[1,0],[0,1]], FH=[[-1,0],[0,1]], FV=[[1,0],[0,-1]];
function rot(d){var a=d*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return [[c,-s],[s,c]]}
function mul(A,B){return [[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]]}
function r6(x){return Math.round(x*1e6)/1e6}
function css(M){return "matrix("+[M[0][0],M[1][0],M[0][1],M[1][1]].map(r6).join(",")+",0,0)"}
function marker(s){var c=[0,0];s.p.forEach(function(v){c[0]+=v[0]/s.p.length;c[1]+=v[1]/s.p.length});var v=s.p[0];return [v[0]+(c[0]-v[0])*.25,v[1]+(c[1]-v[1])*.25]}
function pts(s,M){return s.p.concat([marker(s)]).map(function(v){return [M[0][0]*v[0]+M[0][1]*v[1],M[1][0]*v[0]+M[1][1]*v[1]]})}
function same(s,A,B){var a=pts(s,A),b=pts(s,B);
  function near(u,v){return Math.abs(u[0]-v[0])<1.5&&Math.abs(u[1]-v[1])<1.5}
  var mk=near(a[a.length-1],b[b.length-1]);
  return mk&&a.slice(0,-1).every(function(u){return b.slice(0,-1).some(function(v){return near(u,v)})})}

var mode="prac",si=2,M=I,T=I,qShape=0,qi=0,score=0,missed=false,locked=false,muted=false,ctx=null,hist=[];

function draw(svg,s,color,Mx){
  var g="";[-100,-50,50,100].forEach(function(k){g+='<line x1="'+k+'" y1="-110" x2="'+k+'" y2="110" stroke="#dbe7f5"/><line x1="-110" y1="'+k+'" x2="110" y2="'+k+'" stroke="#dbe7f5"/>'});
  g+='<line x1="0" y1="-112" x2="0" y2="112" stroke="#9db6d6" stroke-dasharray="5 4"/><line x1="-112" y1="0" x2="112" y2="0" stroke="#9db6d6" stroke-dasharray="5 4"/>';
  var m=marker(s);
  g+='<g class="obj" style="transform:'+css(Mx)+'"><polygon points="'+s.p.join(" ")+'" fill="'+color+'" fill-opacity=".85" stroke="#1b2a41" stroke-width="3" stroke-linejoin="round"/><circle cx="'+m[0]+'" cy="'+m[1]+'" r="9" fill="#fff" stroke="#1b2a41" stroke-width="3"/></g>';
  svg.innerHTML=g;
}
function upd(){var o=$("me").querySelector(".obj");if(o)o.style.transform=css(M)}

function tone(list,type,gap){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();var t=ctx.currentTime;list.forEach(function(f,i){var o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.18,t+i*gap);g.gain.exponentialRampToValueAtTime(.001,t+i*gap+gap*.95);o.connect(g);g.connect(ctx.destination);o.start(t+i*gap);o.stop(t+i*gap+gap)})}catch(e){}}

function op(Op,label){
  if(locked)return;
  M=mul(Op,M);upd();
  hist.push(label);$("log").textContent=mode==="prac"?"움직임: "+hist.slice(-5).join(" → "):"";
}
function resetMe(){M=I;hist=[];$("log").textContent="";$("fb").className="";locked=false;
  draw($("me"),mode==="prac"?SHAPES[si]:SHAPES[qShape],"#2a7de1",M)}

function chips(){
  $("chips").innerHTML="";
  SHAPES.forEach(function(s,i){var b=document.createElement("button");b.textContent=s.n;b.setAttribute("aria-pressed",i===si);
    b.onclick=function(){si=i;chips();resetMe()};$("chips").appendChild(b)});
}

function setMode(m){
  mode=m;var q=m==="quiz";
  $("tPrac").setAttribute("aria-pressed",!q);$("tQuiz").setAttribute("aria-pressed",q);
  $("tgtBox").classList.toggle("hidden",!q);$("stages").classList.toggle("two",q);
  $("qinfo").classList.toggle("hidden",!q);$("shapeCard").classList.toggle("hidden",q);
  $("helpCard").classList.toggle("hidden",false);$("stepWrap").classList.toggle("hidden",q);
  $("check").classList.toggle("hidden",!q);$("next").classList.add("hidden");
  $("result").hidden=true;$("stageCard").classList.remove("hidden");$("ctrlCard").classList.remove("hidden");
  $("meCap").textContent=q?"🟦 내 도형 (목표처럼 만들어요)":"🟦 내 도형";
  if(q){qi=0;score=0;newQ()}else{chips();resetMe()}
}

function newQ(){
  qShape=Math.floor(Math.random()*SHAPES.length);var s=SHAPES[qShape];
  var ops=[rot(90),rot(-90),FH,FV];
  do{T=I;var k=1+Math.floor(Math.random()*3);for(var i=0;i<k;i++)T=mul(ops[Math.floor(Math.random()*4)],T)}while(same(s,T,I));
  missed=false;draw($("tgt"),s,"#f08a24",T);resetMe();
  $("qn").textContent="문제 "+(qi+1)+" / 5";$("qs").textContent="맞힌 문제 "+score;
  $("check").classList.remove("hidden");$("next").classList.add("hidden");
}

$("ccw").onclick=function(){var d=mode==="quiz"?90:+$("step").value;op(rot(-d),"반시계 "+d+"°")};
$("cw").onclick=function(){var d=mode==="quiz"?90:+$("step").value;op(rot(d),"시계 "+d+"°")};
$("fh").onclick=function(){op(FH,"좌우 뒤집기")};
$("fv").onclick=function(){op(FV,"상하 뒤집기")};
$("reset").onclick=resetMe;
$("tPrac").onclick=function(){setMode("prac")};
$("tQuiz").onclick=function(){setMode("quiz")};
$("mute").onclick=function(){muted=!muted;$("mute").textContent=muted?"🔇":"🔊"};

$("check").onclick=function(){
  if(locked)return;var fb=$("fb");
  if(same(SHAPES[qShape],M,T)){
    locked=true;if(!missed)score++;$("qs").textContent="맞힌 문제 "+score;
    fb.className="ok";fb.textContent="🎉 정답이에요! 색은 달라도 같은 모양이에요.";tone([660,880],"sine",.16);
    $("check").classList.add("hidden");$("next").textContent=qi===4?"결과 보기 🏁":"다음 문제 ▶";$("next").classList.remove("hidden");
  }else{
    missed=true;fb.className="no";fb.textContent="🤔 다시 생각해 보세요! ⚪ 표시가 목표에서 어디에 있는지 살펴보세요.";tone([220,170],"sawtooth",.18);
  }
};
$("next").onclick=function(){
  qi++;
  if(qi>=5){$("stageCard").classList.add("hidden");$("ctrlCard").classList.add("hidden");$("helpCard").classList.add("hidden");$("result").hidden=false;
    $("fin").textContent=score;var st=score>=5?3:score>=3?2:1;$("stars").textContent="⭐".repeat(st)+"☆".repeat(3-st);
    $("msg").textContent=score===5?"모두 맞혔어요! 도형 박사님이에요 🏆":score>=3?"잘했어요! 조금만 더 연습해요 👏":"연습 모드에서 먼저 돌려 보고 다시 도전해요 💪";
    tone([523,659,784,1047],"triangle",.17);
  }else newQ();
};
$("again").onclick=function(){setMode("quiz")};
setMode("prac");
</script>
</body>
</html>
