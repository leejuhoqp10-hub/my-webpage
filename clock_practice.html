<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시계읽기연습</title>
<style>
:root{--ink:#24345a;--blue:#526fe4;--pink:#fa7098;--bg:#f5f7ff}*{box-sizing:border-box}body{margin:0;font-family:'Arial','Malgun Gothic',sans-serif;background:linear-gradient(145deg,#e9f5ff,#fff3f7);color:var(--ink);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}header{text-align:center}h1{font-size:clamp(25px,5vw,38px);margin:8px 0}header p{margin:8px 0 20px;color:#52617d}.panel{background:#fff;border-radius:24px;box-shadow:0 10px 30px #364b8520;padding:22px;margin:16px 0}.levels{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.level{border:2px solid #dbe2f7;border-radius:14px;background:white;padding:12px 16px;font-size:16px;font-weight:bold;color:var(--ink);cursor:pointer}.level.active{background:var(--blue);color:white;border-color:var(--blue)}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.stat{flex:1;min-width:115px;background:#f4f7ff;border-radius:15px;text-align:center;padding:12px}.stat strong{display:block;font-size:27px}.clock-area{display:flex;align-items:center;justify-content:center;flex-direction:column}.clock{width:min(78vw,350px);height:auto;filter:drop-shadow(0 9px 10px #7184b52a)}.prompt{font-size:23px;font-weight:bold;text-align:center;margin:16px 0}.answer{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.answer input{width:90px;padding:13px 8px;border:2px solid #bfcbed;border-radius:14px;text-align:center;font-size:24px;color:var(--ink)}.answer label{font-size:20px;font-weight:bold}button.main{border:0;border-radius:15px;padding:14px 26px;background:var(--blue);color:white;font-size:19px;font-weight:bold;cursor:pointer}button.secondary{background:#edf1ff;color:#354caa;border:0;border-radius:12px;padding:11px 17px;font-size:15px;font-weight:bold;cursor:pointer}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.feedback{min-height:74px;text-align:center;padding:14px;font-size:18px;line-height:1.6;border-radius:14px;background:#f7f9ff;margin-top:17px}.feedback.good{background:#e7f9ef;color:#146a40}.feedback.bad{background:#fff2e6;color:#97500d}.tip{text-align:center;font-size:15px;color:#596784;line-height:1.7}.celebrate{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:10}.confetti{position:absolute;top:-40px;width:12px;height:18px;border-radius:3px;animation:fall 1.5s ease-in forwards}.balloon{position:absolute;bottom:-75px;font-size:45px;animation:rise 1.5s ease-out forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}@keyframes rise{to{transform:translateY(-95vh) rotate(15deg);opacity:0}}@media(max-width:500px){.panel{padding:15px}.level{flex:1 1 42%;padding:11px 5px;font-size:14px}.answer input{width:76px}.stat{min-width:85px}.prompt{font-size:21px}}
</style>
</head>
<body><main class="wrap"><header><h1>⏰ 시계읽기연습</h1><p>시계를 자세히 보고 몇 시 몇 분인지 맞혀 보세요!</p></header>
<section class="panel"><div class="levels" aria-label="난이도 선택"><button class="level active" data-level="1">⭐ 1단계 · 정시</button><button class="level" data-level="2">🌟 2단계 · 30분</button><button class="level" data-level="3">✨ 3단계 · 5분</button><button class="level" data-level="4">🚀 4단계 · 1분</button></div></section>
<section class="panel"><div class="stats"><div class="stat">전체 문제<strong id="total">0</strong></div><div class="stat">😊 정답<strong id="correct">0</strong></div><div class="stat">🌱 오답<strong id="wrong">0</strong></div></div><div class="clock-area"><svg class="clock" viewBox="0 0 400 400" role="img" aria-label="시각을 맞히기 위한 아날로그 시계"><circle cx="200" cy="200" r="185" fill="#e0e9ff"/><circle cx="200" cy="200" r="174" fill="white" stroke="#6c83dd" stroke-width="5"/><g id="ticks"></g><g id="numbers"></g><g id="hour" transform="rotate(0 200 200)"><line x1="200" y1="215" x2="200" y2="109" stroke="#293e75" stroke-width="13" stroke-linecap="round"/></g><g id="minute" transform="rotate(0 200 200)"><line x1="200" y1="220" x2="200" y2="65" stroke="#fa7098" stroke-width="8" stroke-linecap="round"/></g><circle cx="200" cy="200" r="11" fill="#293e75"/><circle cx="200" cy="200" r="5" fill="white"/></svg></div><div class="prompt">🧐 지금은 몇 시 몇 분일까요?</div><div class="answer"><input id="hourInput" type="number" inputmode="numeric" min="1" max="12" placeholder="시" aria-label="시 입력"><label for="hourInput">시</label><input id="minuteInput" type="number" inputmode="numeric" min="0" max="59" placeholder="분" aria-label="분 입력"><label for="minuteInput">분</label></div><div class="actions"><button class="main" id="check">정답 확인! 🎉</button><button class="secondary" id="next">다른 문제 ↻</button></div><div id="feedback" class="feedback" aria-live="polite">숫자를 입력한 뒤 정답 확인을 눌러 주세요!</div></section><section class="panel tip">💡 <b>짧은 바늘은 시침</b>으로 '시'를 알려 주고, <b>긴 바늘은 분침</b>으로 '분'을 알려 줘요.<br>분침이 눈금 한 칸 움직이면 1분, 숫자 하나만큼 움직이면 5분이에요.</section></main><div id="celebrate" class="celebrate" aria-hidden="true"></div>
<script>
const NS='http://www.w3.org/2000/svg',ticks=document.getElementById('ticks'),numbers=document.getElementById('numbers');
for(let i=0;i<60;i++){let a=i*Math.PI/30,x1=200+Math.sin(a)*(i%5===0?151:158),y1=200-Math.cos(a)*(i%5===0?151:158),x2=200+Math.sin(a)*167,y2=200-Math.cos(a)*167;let line=document.createElementNS(NS,'line');for(let [k,v] of Object.entries({x1,y1,x2,y2,stroke:i%5===0?'#52669e':'#b5c2df','stroke-width':i%5===0?4:2,'stroke-linecap':'round'}))line.setAttribute(k,v);ticks.appendChild(line)}
for(let i=1;i<=12;i++){let a=i*Math.PI/6,t=document.createElementNS(NS,'text');t.setAttribute('x',200+Math.sin(a)*126);t.setAttribute('y',200-Math.cos(a)*126+9);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','30');t.setAttribute('font-weight','bold');t.setAttribute('fill','#263b70');t.textContent=i;numbers.appendChild(t)}
let level=1,hour=3,minute=0,total=0,correct=0,wrong=0,locked=false,timer=null,lastKey='';const $=id=>document.getElementById(id);
function renderStats(){$('total').textContent=total;$('correct').textContent=correct;$('wrong').textContent=wrong}
function newQuestion(){clearTimeout(timer);locked=false;let h,m,key,tries=0;do{h=1+Math.floor(Math.random()*12);m=level===1?0:level===2?30*Math.floor(Math.random()*2):level===3?5*Math.floor(Math.random()*12):Math.floor(Math.random()*60);key=h+':'+m;tries++}while(key===lastKey&&tries<20);lastKey=key;hour=h;minute=m;$('hour').setAttribute('transform',`rotate(${(h%12)*30+m*.5} 200 200)`);$('minute').setAttribute('transform',`rotate(${m*6} 200 200)`);$('hourInput').value='';$('minuteInput').value='';$('feedback').className='feedback';$('feedback').textContent='시침과 분침을 잘 살펴보세요!';$('check').disabled=false}
function party(){let layer=$('celebrate');layer.innerHTML='';const colors=['#f66b9c','#f7c955','#62c9c0','#7085f3','#b28bfa'];for(let i=0;i<35;i++){let el=document.createElement('span');el.className='confetti';el.style.left=Math.random()*100+'%';el.style.background=colors[i%colors.length];el.style.animationDelay=Math.random()*.35+'s';layer.appendChild(el)}for(let i=0;i<6;i++){let el=document.createElement('span');el.className='balloon';el.textContent=['🎈','🎉','🎈'][i%3];el.style.left=(8+i*16)+'%';el.style.animationDelay=i*.08+'s';layer.appendChild(el)}setTimeout(()=>layer.innerHTML='',1700)}
function check(){if(locked)return;let hs=$('hourInput').value,ms=$('minuteInput').value;if(hs===''||ms===''||!Number.isInteger(Number(hs))||!Number.isInteger(Number(ms))||Number(hs)<1||Number(hs)>12||Number(ms)<0||Number(ms)>59){$('feedback').className='feedback bad';$('feedback').textContent='시에는 1~12, 분에는 0~59 사이의 숫자를 넣어 주세요.';return}total++;locked=true;$('check').disabled=true;if(Number(hs)===hour&&Number(ms)===minute){correct++;$('feedback').className='feedback good';$('feedback').textContent=`🎉 정답이에요! ${hour}시 ${minute}분! 정말 잘했어요!`;party();timer=setTimeout(newQuestion,1500)}else{wrong++;$('feedback').className='feedback bad';let tip=`긴 분침은 ${minute===0?'12를 가리켜 0분':minute+'분 위치'}이고, 짧은 시침은 ${hour}시${minute?'를 조금 지난 위치':'를 가리켜요'}.`;$('feedback').textContent=`🌱 정답은 ${hour}시 ${minute}분이에요! ${tip} 다음 문제도 도전해 보세요.`}renderStats()}
document.querySelectorAll('.level').forEach(btn=>btn.addEventListener('click',()=>{level=Number(btn.dataset.level);document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b===btn));lastKey='';newQuestion()}));$('check').addEventListener('click',check);$('next').addEventListener('click',newQuestion);[$('hourInput'),$('minuteInput')].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')check()}));newQuestion();
</script></body></html>
