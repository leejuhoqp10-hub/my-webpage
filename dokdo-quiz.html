<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독도의 날 퀴즈</title>
<style>
:root{--sea:#0b3d6b;--sea2:#1565a8;--sky:#e6f2fb;--ink:#14233a;--ok:#1f9d55;--okbg:#dff5e8;--no:#d6453d;--nobg:#fde8e6;--line:#b9d3ea}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sea) 0,var(--sea) 150px,var(--sky) 150px);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:20px 16px 40px}
.app{max-width:720px;margin:0 auto}
header{color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:30px;letter-spacing:-.02em}
header p{margin:2px 0 0;opacity:.85}
#mute{font:inherit;font-size:22px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;width:48px;height:48px;cursor:pointer;flex:none}
.card{background:#fff;border-radius:18px;padding:24px 22px;box-shadow:0 8px 24px rgba(11,61,107,.18)}
.top{display:flex;justify-content:space-between;font-weight:700;color:var(--sea2);margin-bottom:8px}
.bar{height:12px;background:var(--sky);border-radius:6px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--sea2);transition:width .3s}
h2{margin:0 0 20px;font-size:26px;line-height:1.4;letter-spacing:-.02em}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-size:20px;text-align:left;min-height:64px;padding:12px 16px;border:2px solid var(--line);background:#fff;border-radius:14px;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sky);color:var(--sea2);display:grid;place-items:center;font-size:16px}
.opt:active{transform:scale(.98)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--nobg);border-color:var(--no);animation:shake .35s}
.opt:disabled{cursor:default}
.opt.bad:disabled{opacity:.7}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fb{min-height:64px;margin-top:18px;padding:14px 16px;border-radius:14px;font-size:19px;font-weight:600;display:none}
#fb.ok{display:block;background:var(--okbg);color:#14653a}
#fb.no{display:block;background:var(--nobg);color:#9b2a24}
.main-btn{font:inherit;font-size:20px;font-weight:700;margin-top:16px;width:100%;min-height:60px;border:0;border-radius:14px;background:var(--sea);color:#fff;cursor:pointer}
.main-btn:hover{background:var(--sea2)}
.hidden{display:none!important}
.result{text-align:center}
.result .big{font-size:72px;font-weight:800;color:var(--sea2);line-height:1.1;margin:8px 0}
.result .big small{font-size:28px;color:var(--ink)}
.result p{font-size:20px;margin:6px 0}
.stars{font-size:36px;letter-spacing:4px}
button:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
@media (max-width:520px){h1{font-size:24px}h2{font-size:22px}.opt{font-size:18px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>🏝️ 독도의 날 퀴즈</h1><p>10월 25일, 독도를 알아봐요!</p></div>
    <button id="mute" aria-label="효과음 끄기/켜기">🔊</button>
  </header>

  <section class="card" id="quiz">
    <div class="top"><span id="no">1 / 10</span><span id="sc">맞힌 문제 0</span></div>
    <div class="bar"><i id="bar"></i></div>
    <h2 id="q"></h2>
    <div class="opts" id="opts"></div>
    <div id="fb" role="status" aria-live="polite"></div>
    <button class="main-btn hidden" id="next">다음 문제 ▶</button>
  </section>

  <section class="card result hidden" id="result">
    <div class="stars" id="stars"></div>
    <div class="big"><span id="final">0</span><small> / 10</small></div>
    <p id="msg"></p>
    <p style="color:#56657a;font-size:16px">처음 시도에 맞힌 문제만 점수에 들어가요.</p>
    <button class="main-btn" id="retry">🔄 다시 풀기</button>
  </section>
</div>

<script>
/* 문제 데이터: 다른 주제(예: 독서 퀴즈)는 이 객체만 바꾸면 됩니다. [문제, 정답, 오답1, 오답2, 오답3, 해설] */
var QUIZ = {
  count: 10,
  pool: [
    ["독도의 날은 언제일까요?","10월 25일","3월 1일","8월 15일","10월 9일","독도의 날은 매년 10월 25일이에요."],
    ["독도의 날은 어떤 뜻으로 정한 날일까요?","독도가 우리 땅임을 알리고 지키자는 날","새 학년이 시작되는 날","나무를 심는 날","한글을 만든 날","독도를 사랑하는 마음을 모으는 날이에요."],
    ["독도는 어느 나라 땅일까요?","대한민국","일본","중국","러시아","독도는 대한민국의 아름다운 영토예요."],
    ["독도는 우리나라의 어느 쪽 끝에 있을까요?","동쪽 끝","서쪽 끝","남쪽 끝","북쪽 끝","독도는 우리나라 가장 동쪽에 있어서 해가 먼저 떠요."],
    ["독도는 크게 몇 개의 섬으로 이루어져 있을까요?","2개 (동도, 서도)","1개","3개","4개","독도는 동도와 서도 두 개의 큰 섬과 작은 바위섬들로 이루어져 있어요."],
    ["독도가 있는 바다는 어디일까요?","동해","서해","남해","황해","독도는 동해에 있어요."],
    ["독도와 가장 가까운 큰 섬은 어디일까요?","울릉도","제주도","강화도","거제도","울릉도에서 맑은 날 독도가 보여요."],
    ["독도에서 많이 볼 수 있는 새는 무엇일까요?","괭이갈매기","펭귄","앵무새","타조","괭이갈매기가 독도 하늘을 날아다녀요."],
    ["조선 시대에 울릉도와 독도를 지키려고 애쓴 사람은 누구일까요?","안용복","세종대왕","장보고","허준","안용복은 일본 어부들에게 독도가 우리 땅임을 당당하게 알렸어요."],
    ["독도는 어떻게 만들어진 섬일까요?","화산이 터져서 생긴 화산섬","모래가 쌓여서 생긴 모래섬","갯벌이 넓어져서 생긴 섬","얼음이 녹아서 생긴 섬","독도는 아주 오래전 바다 속 화산이 터져 만들어졌어요."],
    ["독도의 행정구역(주소)은 어디일까요?","경상북도 울릉군","제주특별자치도","강원특별자치도 속초시","부산광역시","독도의 주소는 경상북도 울릉군 울릉읍 독도리예요."],
    ["독도를 지키며 바다와 하늘을 살피는 분들은 누구일까요?","독도경비대","우체부 아저씨","요리사 선생님","수영 선수","독도경비대원들이 늘 독도를 지켜요."],
    ["옛날 울릉도와 독도 지역에 있던 나라의 이름은 무엇일까요?","우산국","가야","백제","고구려","신라의 이사부 장군이 우산국을 신라 땅으로 만들었어요."],
    ["독도는 소중한 자연을 지키기 위해 무엇으로 지정되어 있을까요?","천연기념물","놀이공원","공항","시장","독도의 자연은 천연기념물로 보호받고 있어요."],
    ["독도를 사랑하는 방법으로 알맞은 것은?","독도에 대해 배우고 친구들에게 알리기","독도 바위에 낙서하기","독도 바다에 쓰레기 버리기","독도에 대해 모르는 척하기","독도를 알고 알리는 것이 독도 사랑의 시작이에요."]
  ]
};

var $ = function(id){return document.getElementById(id)};
var cur = [], idx = 0, score = 0, missed = false, muted = false, ctx = null;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* 효과음 (Web Audio) */
function tone(list,type,gap){
  if(muted)return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    var t = ctx.currentTime;
    list.forEach(function(f,i){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.18,t+i*gap); g.gain.exponentialRampToValueAtTime(.001,t+i*gap+gap*.95);
      o.connect(g); g.connect(ctx.destination); o.start(t+i*gap); o.stop(t+i*gap+gap);
    });
  }catch(e){}
}

function start(){
  cur = shuffle(QUIZ.pool).slice(0,QUIZ.count).map(function(r){
    return {q:r[0],a:r[1],opts:shuffle(r.slice(1,5)),exp:r[5]};
  });
  idx=0; score=0;
  $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
  show();
}

function show(){
  var q=cur[idx]; missed=false;
  $("no").textContent=(idx+1)+" / "+cur.length;
  $("sc").textContent="맞힌 문제 "+score;
  $("bar").style.width=(idx/cur.length*100)+"%";
  $("q").textContent=q.q;
  $("fb").className=""; $("fb").textContent="";
  $("next").classList.add("hidden");
  var box=$("opts"); box.innerHTML="";
  q.opts.forEach(function(text,i){
    var b=document.createElement("button");
    b.className="opt"; b.type="button";
    var n=document.createElement("b"); n.textContent=i+1;
    var s=document.createElement("span"); s.textContent=text;
    b.appendChild(n); b.appendChild(s);
    b.onclick=function(){pick(b,text)};
    box.appendChild(b);
  });
}

function pick(btn,text){
  var q=cur[idx], fb=$("fb");
  if(text===q.a){
    btn.classList.add("good");
    if(!missed) score++;
    $("sc").textContent="맞힌 문제 "+score;
    document.querySelectorAll(".opt").forEach(function(o){o.disabled=true});
    fb.className="ok"; fb.textContent="🎉 정답이에요! "+q.exp;
    tone([660,880],"sine",.16);
    $("bar").style.width=((idx+1)/cur.length*100)+"%";
    $("next").textContent = idx===cur.length-1 ? "결과 보기 🏁" : "다음 문제 ▶";
    $("next").classList.remove("hidden");
  }else{
    missed=true;
    btn.classList.remove("bad"); void btn.offsetWidth; btn.classList.add("bad"); btn.disabled=true;
    fb.className="no"; fb.textContent="🤔 다시 생각해 보세요!";
    tone([220,170],"sawtooth",.18);
  }
}

function finish(){
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  $("final").textContent=score;
  var stars=score>=9?3:score>=6?2:1;
  $("stars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
  $("msg").textContent = score===10?"만점이에요! 독도 박사님이네요! 🏆":score>=7?"아주 잘했어요! 독도를 잘 알고 있네요 👏":score>=4?"좋아요! 한 번 더 도전해 볼까요? 💪":"괜찮아요! 다시 풀면 더 잘할 수 있어요 😊";
  tone([523,659,784,1047],"triangle",.17);
}

$("next").onclick=function(){ idx++; if(idx>=cur.length) finish(); else show(); };
$("retry").onclick=start;
$("mute").onclick=function(){muted=!muted;$("mute").textContent=muted?"🔇":"🔊"};
start();
</script>
</body>
</html>
