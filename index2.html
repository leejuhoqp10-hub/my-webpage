
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이주호의 홈페이지</title>

<style>
:root {
  --green: #1d3b36;
  --paper: #f4f7f6;
  --ink: #16211f;
  --sub: #56655f;
  --line: #cbd8d3;
  --accent: #1f6f5c;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR",
    "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.7;
}

/* 타입 선택자 */
h1 {
  margin: 0;
  font-size: 56px;
  line-height: 1.15;
  letter-spacing: -.03em;
}

h2 {
  margin: 0 0 14px;
  font-size: 24px;
  letter-spacing: -.02em;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--ink);
}

h3 {
  margin: 0 0 6px;
  font-size: 19px;
}

p {
  margin: 0 0 10px;
}

a {
  color: var(--accent);
}

a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

/* 상단 헤더 */
header {
  background: var(--green);
  color: #fff;
  padding: 72px 20px 56px;
  text-align: center;
}

header p {
  margin: 14px 0 0;
  font-size: 22px;
  color: #bfe3d8;
  font-weight: 600;
}

/* 메뉴 */
nav {
  background: #fff;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 5;
}

nav ul {
  list-style: none;
  margin: 0 auto;
  padding: 0;
  max-width: 760px;
  display: flex;
  justify-content: center;
  gap: 4px;
  flex-wrap: wrap;
}

nav a {
  display: block;
  padding: 14px 16px;
  text-decoration: none;
  color: var(--ink);
  font-weight: 600;
}

nav a:hover {
  color: var(--accent);
  background: #eef5f2;
}

/* 본문 */
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 12px 20px 40px;
}

section {
  padding: 32px 0 8px;
  scroll-margin-top: 70px;
}

/* 소개 */
#intro dl {
  margin: 0;
}

#intro dt {
  float: left;
  clear: left;
  width: 80px;
  color: var(--sub);
}

#intro dd {
  margin: 0 0 6px 80px;
}

/* 개별 프로젝트 */
.project {
  background: #fff;
  border: 1px solid var(--line);
  border-left: 6px solid var(--accent);
  border-radius: 8px;
  padding: 18px 20px;
  margin-bottom: 14px;
}

.project p {
  color: var(--sub);
}

.project .link {
  display: inline-block;
  margin-top: 4px;
  padding: 8px 14px;
  background: var(--ink);
  color: #fff;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 600;
}

.project .link:hover {
  background: var(--accent);
}

/* 하단 */
footer {
  background: var(--green);
  color: #bfe3d8;
  text-align: center;
  padding: 24px 20px;
  font-size: 14px;
}

footer p {
  margin: 0;
}

/* 모바일 반응형 */
@media (max-width: 600px) {
  h1 {
    font-size: 38px;
  }

  header {
    padding: 48px 16px 36px;
  }

  header p {
    font-size: 18px;
  }

  h2 {
    font-size: 21px;
  }

  nav a {
    padding: 12px 10px;
    font-size: 15px;
  }

  #intro dt {
    float: none;
    width: auto;
  }

  #intro dd {
    margin-left: 0;
  }
}
</style>
</head>

<body>

</html>
